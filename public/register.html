<!DOCTYPE html><html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e11">
<title>Register | NexShares</title><style>
                                                                            
body{
margin:0;
font-family:Arial;
background:linear-gradient(#0b0e11,#121826);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.container{
width:95%;
max-width:400px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
padding:20px;
box-sizing:border-box;
border-radius:20px;
}

h2{
text-align:center;
color:#f3ba2f;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:17px;
cursor:pointer;
margin-top:15px;
background:linear-gradient(45deg,#1e90ff,#4da3ff);
color:white;
}

.link{
text-align:center;
margin-top:15px;
}

.link a{
color:#f3ba2f;
text-decoration:none;
}

</style></head><body><div class="container"><h2>Create Account</h2>
<input id="username" placeholder="Username">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="referral" placeholder="Referral Code (Optional)">
<button id="registerBtn">Register</button>
                                                                                                                                                                                                                                                                             
<div class="link">
Already have account?


</div></div>


<script>
document.getElementById("registerBtn").addEventListener("click", register);


async function register(event) {
  let btn = event.target
  btn.disabled = true
  btn.innerText = "Registering..."

  // Get form values
  let username = document.getElementById("username").value.trim()
  let email = document.getElementById("email").value.trim()
  let password = document.getElementById("password").value.trim()
  let referralInput = document.getElementById("referral").value.trim()

  try {
    // Fetch API to Railway backend
    let res =
await fetch("http://localhost:5000/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username,
        email,
        password,
        referral: referralInput || null
      })
    })

    let data = await res.json()
    console.log("Register API response:", data)

    // SUCCESS → redirect to verification
    if (data.status === "success") {
      localStorage.setItem("verifyEmail", email)
      window.location.href = "verify.html"
    } else {
      // ERROR → show message
      alert(data.message || "Registration failed")
    }

  } catch (err) {
    console.error("Frontend registration error:", err)
    alert("Server error. Please try again later.")
  } finally {
    // ALWAYS reset button state
    btn.disabled = false
    btn.innerText = "Register"
  }
}

// Pre-fill referral code from URL query if present
const params = new URLSearchParams(window.location.search)
let referral = params.get("ref") || null
if (referral) {
  let refInput = document.getElementById("referral")
  if (refInput) refInput.value = referral
}
</script>


</body>
</html>
